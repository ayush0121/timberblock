# Netlify. Cloudflare Pages uses the same _headers/_redirects files in
# public/, so this file is the only host-specific piece.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
